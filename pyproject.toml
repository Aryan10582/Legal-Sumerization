[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indian-legal-nlp-mini-project"
version = "0.1.0"
description = "Separate, reproducible judgment summarization and CUAD clause classification experiments"
requires-python = ">=3.11,<3.14"
dependencies = ["torch>=2.6", "transformers>=4.48,<6", "scikit-learn>=1.5", "streamlit>=1.57", "sentencepiece", "rouge-score==0.1.2", "pypdf>=5", "python-docx>=1.1", "requests>=2.32", "pyyaml>=6", "joblib>=1.4", "matplotlib>=3.8", "psutil>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
